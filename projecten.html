<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Philip Somers</title>
    <link href="style.css" rel="stylesheet"/>
<script>
  document.documentElement.dataset.direction = 'forward';
</script>
</head>
<body class="projecten-page">

<audio id="bg-music" autoplay loop>
  <source src="audio/PVZmaintheme.mp3" type="audio/mpeg">
</audio>

<nav class="projects-nav">
  <a href="index.html" class="nav-return">
    <img src="img/Projectenback.png" class="projecten-img-default" alt="Return">
    <img src="img/Projectenbackhover.png" class="projecten-img-hover" alt="Return">
  </a>

<div id="Furhat"></div>
  <nav class="furhat-nav">
    <a href="" class="nav-furhat-link" id="furhat-link">
      <img src="img/Furhattitlelink.png" class="furhat-link-default" alt="Furhat">
      <img src="img/Furhattitlelinkhover.png" class="furhat-link-hover" alt="Furhat">
    </a>
  </nav>

<div id="furhat-overlay">
  <div class="furhat-overlay-inner">
    <img src="img/Furhatinfo.png" alt="Furhat info" class="furhat-main-img">
    <div class="furhat-close-wrap">
      <img src="img/Exitcontact.png" alt="Exit" class="furhat-close-btn furhat-close-default">
      <img src="img/Exitcontacthover.png" alt="Exit" class="furhat-close-btn furhat-close-hover">
    </div>
  </div>
</div>

<div id="DI-Lab"></div>
  <nav class="DI-Lab-nav">
    <a href="" class="nav-DI-Lab-link" id="DI-Lab-link">
      <img src="img/DI-LabTitleLink.png" class="DI-Lab-link-default" alt="DI-Lab">
      <img src="img/DI-LabTitleLinkhover.png" class="DI-Lab-link-hover" alt="DI-Lab">
    </a>
  </nav>

<div id="DI-Lab-overlay">
  <div class="DI-Lab-overlay-inner">
    <img src="img/DI-labinfo.png" alt="DI-Lab info" class="DI-Lab-main-img">
    <div class="DI-Lab-close-wrap">
      <img src="img/Exitcontact.png" alt="Exit" class="DI-Lab-close-btn DI-Lab-close-default">
      <img src="img/Exitcontacthover.png" alt="Exit" class="DI-Lab-close-btn DI-Lab-close-hover">
    </div>
  </div>
</div>

<div id="Watersley"></div>
  <nav class="Watersley-nav">
    <a href="" class="nav-Watersley-link" id="Watersley-link">
      <img src="img/Watersleytitlelink.png" class="Watersley-link-default" alt="Watersley">
      <img src="img/Watersleytitlelinkhover.png" class="Watersley-link-hover" alt="Watersley">
    </a>
  </nav>

<div id="Watersley-overlay">
  <div class="Watersley-overlay-inner">
    <img src="img/Watersleyinfo.png" alt="Watersley info" class="Watersley-main-img">
    <div class="Watersley-close-wrap">
      <img src="img/Exitcontact.png" alt="Exit" class="Watersley-close-btn Watersley-close-default">
      <img src="img/Exitcontacthover.png" alt="Exit" class="Watersley-close-btn Watersley-close-hover">
    </div>
  </div>
</div>

<script src="music.js"></script>
<script src="projecten.js"></script>
<script src="transitions.js"></script>
</body>
</html>
